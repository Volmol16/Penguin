; step5_merged — Step 3 (wake word "Ирина" на реальном микрофоне) +
; Step 4 (OLED-диагностика при старте + анимированные глазки) в одной
; прошивке. Ещё без WiFi/сервера — тот шаг следующий (step6).

[platformio]
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; N16R8: 16 МБ Flash + 8 МБ Octal PSRAM — арена модели и буферы в PSRAM.
; Не забудьте menuconfig -> SPIRAM -> Octal Mode PSRAM (как в Step 1-3,
; настройки menuconfig не переносятся между проектами).
build_flags =
    -DBOARD_HAS_PSRAM
